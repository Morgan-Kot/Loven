<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Laws</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background-color: #242424;
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      font-size: 1.65rem;
      font-weight: 400;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background-color: #333333;
      border-color: #555555;
    }

    .btn:active {
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div class="button-container">
    <a href="Grundloven.html" class="btn">Grundloven</a>
    <a href="#" class="btn">Straffeloven</a>
    <a href="#" class="btn">Dommer Regler</a>
  </div>

</body>
</html>
